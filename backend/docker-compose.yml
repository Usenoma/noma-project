# Local/dev infra. Host ports are offset to avoid clashing with other stacks on the build server.
name: noma
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noma
      POSTGRES_PASSWORD: noma
      POSTGRES_DB: noma
    ports: ["127.0.0.1:55442:5432"]
    volumes: [noma-pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56389:6379"]
volumes:
  noma-pg:
